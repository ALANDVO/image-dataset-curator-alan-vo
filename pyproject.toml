[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "image-dataset-curator"
version = "1.0.0"
description = "Inspect uploaded images for dimensions, EXIF privacy and perceptual duplicates; curate splits and export manifests."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alan Vo", email = "alanvo@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.41",
    "alembic==1.15.2",
    "pydantic==2.11.3",
    "pydantic-settings==2.9.1",
    "python-multipart==0.0.20",
    "Pillow==11.2.1",
    "imagehash==4.3.2",
    "piexif==1.1.3",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.5.0",
    "authlib==1.5.1",
    "itsdangerous==2.2.0",
    "starlette==0.46.2",
    "aiofiles==24.1.0",
]

[project.urls]
Homepage = "https://github.com/ALANDVO/image-dataset-curator-alan-vo"
